[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-document-router"
version = "0.1.0"
description = "Privacy-first local document conversion and project routing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dilem Kaya" }]
dependencies = ["markitdown[pdf]>=0.1.3"]

[project.scripts]
document-router = "document_router.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/document_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
